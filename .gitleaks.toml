#
# gitleaks configuration for the gitleaks pre-commit hook and the
# "Secret Scan" CI workflow. It uses the upstream default ruleset and adds an
# allowlist for known non-production placeholders (dev/test env files, docs,
# and test fixtures). These are documented false positives, not real secrets;
# production source code remains in scope.

title = "Superset fork gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-production placeholders and test/doc fixtures (no real secrets)"
# Match the allowlist regexes against the whole line, not just the captured secret.
regexTarget = "line"
paths = [
  # Documentation (examples, versioned docs)
  '''^docs/''',
  '''^superset/mcp_service/.*\.md$''',
  # Tests, specs and fixtures (fake credentials by design)
  '''(^|/)tests?/''',
  '''(^|/)spec/''',
  '''.*\.test\.[tj]sx?$''',
  '''.*fixtures?\.[A-Za-z]+$''',
  '''(^|/)cypress-base/''',
  # Local dev / example deployment config (placeholder credentials)
  '''(^|/)docker/\.env''',
  '''^helm/superset/''',
  '''^superset/examples/''',
  '''(^|/)scripts/databases/''',
]
regexes = [
  # Well-known placeholder values shipped for local dev only
  '''CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET''',
  '''TEST_NON_DEV_SECRET''',
  # Field-name identifiers that the generic-api-key rule mistakes for secrets
  # (cache keys / form-data keys / permalink keys / results keys in examples)
  '''(form_data_key|permalink_key|cache_key|resultsKey)''',
]
