name: "UPSTREAM_SYNC_TOKEN Expiry Check"

# Proactively warns before the UPSTREAM_SYNC_TOKEN PAT (used by
# sync-upstream.yml) expires, so the daily upstream sync never silently
# stops working.
#
# How it alerts (in order):
#   1. Files (or updates) a single tracked GitHub issue, deduped by the
#      `upstream-sync-token` label so it comments on the open issue rather
#      than opening a new one each run. Requires Issues to be enabled.
#   2. Writes a job summary and an ::error:: annotation and FAILS the run,
#      which turns the Actions entry red and triggers GitHub's built-in
#      "scheduled workflow failed" email. This is the fallback if Issues
#      are disabled or issue creation fails.
#   3. If an optional SLACK_WEBHOOK_URL secret is configured, it also posts
#      a message there.
#
# Issue creation uses the default GITHUB_TOKEN (issues: write); a
# fine-grained PAT scoped to Contents+Workflows cannot write issues.
#
# It reads the token's real expiry from the
# `github-authentication-token-expiration` response header that GitHub
# returns on any API call authenticated with a PAT, so the warning is
# based on the actual expiration date rather than a hard-coded reminder.

on:
  schedule:
    # Weekly, Mondays at 06:30 UTC (just after the daily sync window)
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# How many days before expiry to start alerting.
env:
  THRESHOLD_DAYS: "14"

jobs:
  check-token-expiry:
    name: Warn before UPSTREAM_SYNC_TOKEN expires
    runs-on: ubuntu-latest
    steps:
      - name: Check token expiry and alert
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_ISSUE_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ISSUE_LABEL: upstream-sync-token
        run: |
          set -uo pipefail

          # File or update a single tracked issue (deduped by label). Uses the
          # default GITHUB_TOKEN, not the PAT, since a fine-grained PAT scoped
          # to Contents+Workflows cannot write issues. Degrades to a warning
          # if Issues are disabled.
          file_issue() {
            local title="$1" body="$2"
            GH_TOKEN="$GH_ISSUE_TOKEN" gh label create "$ISSUE_LABEL" \
              --repo "$REPO" --color FBCA04 \
              --description "Health alerts for the UPSTREAM_SYNC_TOKEN PAT" \
              >/dev/null 2>&1 || true
            local existing
            existing=$(GH_TOKEN="$GH_ISSUE_TOKEN" gh issue list \
              --repo "$REPO" --label "$ISSUE_LABEL" --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              GH_TOKEN="$GH_ISSUE_TOKEN" gh issue comment "$existing" \
                --repo "$REPO" --body "$body" \
                && echo "Updated tracking issue #$existing." \
                || echo "::warning::Could not comment on issue #$existing (are Issues enabled?)."
            else
              GH_TOKEN="$GH_ISSUE_TOKEN" gh issue create \
                --repo "$REPO" --title "$title" --label "$ISSUE_LABEL" --body "$body" \
                && echo "Filed a new tracking issue." \
                || echo "::warning::Could not create an issue (are Issues enabled on $REPO?)."
            fi
          }

          alert() {
            local msg="$1"
            echo "::error::$msg"
            local body
            body=$(printf '%s\n\n%s\n%s\n%s\n' \
              "$msg" \
              "Rotate the PAT and update the \`UPSTREAM_SYNC_TOKEN\` repo secret." \
              "Required scope: Contents read/write + Workflows read/write" \
              "(classic equivalent: \`repo\` + \`workflow\`).")
            {
              echo "## :warning: UPSTREAM_SYNC_TOKEN alert"
              echo ""
              echo "$body"
            } >> "$GITHUB_STEP_SUMMARY"
            file_issue ":warning: UPSTREAM_SYNC_TOKEN needs attention" "$body"
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              payload=$(jq -n --arg t ":warning: [$REPO] $msg" '{text: $t}')
              curl -fsS -X POST -H 'Content-type: application/json' \
                --data "$payload" "$SLACK_WEBHOOK_URL" \
                || echo "::warning::Slack notification failed to send."
            fi
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            alert "Secret UPSTREAM_SYNC_TOKEN is not set, so the daily upstream sync cannot run."
            exit 1
          fi

          # Any PAT-authenticated response carries the expiration header.
          # Keep stderr in its own file so gh warnings can't pollute the header
          # parse on the success path, while still surfacing them on failure.
          err_file="$(mktemp)"
          if ! headers=$(gh api -i -H "Accept: application/vnd.github+json" /rate_limit 2>"$err_file"); then
            alert "UPSTREAM_SYNC_TOKEN failed to authenticate (it may be expired or revoked):
          $(cat "$err_file")"
            rm -f "$err_file"
            exit 1
          fi
          rm -f "$err_file"

          exp=$(printf '%s\n' "$headers" | tr -d '\r' \
            | sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration:[[:space:]]*//p')

          if [ -z "$exp" ]; then
            echo "::notice::UPSTREAM_SYNC_TOKEN has no expiration date set (or the header was not returned); nothing to warn about."
            echo "UPSTREAM_SYNC_TOKEN reports no expiration date — proactive expiry check not applicable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exp_epoch=$(date -u -d "$exp" +%s)
          now_epoch=$(date -u +%s)
          days=$(( (exp_epoch - now_epoch) / 86400 ))
          echo "UPSTREAM_SYNC_TOKEN expires on ${exp} (${days} day(s) remaining)."

          if [ "$days" -le 0 ]; then
            alert "UPSTREAM_SYNC_TOKEN has EXPIRED (expiry: ${exp}). The daily upstream sync is broken until it is rotated."
            exit 1
          elif [ "$days" -le "${THRESHOLD_DAYS}" ]; then
            alert "UPSTREAM_SYNC_TOKEN expires in ${days} day(s) on ${exp}. Rotate it before then to keep the daily upstream sync running."
            exit 1
          fi

          echo "Token healthy: ${days} day(s) until expiry (threshold ${THRESHOLD_DAYS})." >> "$GITHUB_STEP_SUMMARY"
