name: Sync Fork with Upstream

# Keeps this fork's `master` in sync with apache/superset so upstream
# security patches, dependency bumps and fixes flow in automatically.
#
# It uses GitHub's built-in fork-sync API (the same action as the
# "Sync fork" button), which fast-forwards `master` to the upstream
# default branch. This is safe here because the fork carries no custom
# commits on master; if the branch ever diverges, the API returns a
# conflict and the run fails loudly instead of forcing anything.
#
# IMPORTANT: this uses a Personal Access Token (secret UPSTREAM_SYNC_TOKEN),
# NOT the default GITHUB_TOKEN. Upstream regularly updates files under
# .github/workflows/, and the built-in GITHUB_TOKEN is forbidden from
# creating/updating workflow files (HTTP 422 "without `workflows`
# permission"). A PAT with the `workflow` scope can perform the sync.
# Create a fine-grained PAT scoped to this repo with Contents:read/write
# and Workflows:read/write (or a classic PAT with `repo` + `workflow`),
# then add it as the repo secret UPSTREAM_SYNC_TOKEN.

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never run two syncs at once; don't cancel an in-flight sync
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward master from apache/superset
    runs-on: ubuntu-latest
    steps:
      - name: Sync master via fork-sync API
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret UPSTREAM_SYNC_TOKEN is not set. Create a PAT with the"
            echo "::error::'workflow' scope (Contents + Workflows read/write) and add it as"
            echo "::error::the repo secret UPSTREAM_SYNC_TOKEN. The default GITHUB_TOKEN cannot"
            echo "::error::update .github/workflows files, which upstream syncs require."
            exit 1
          fi
          echo "Syncing ${{ github.repository }}:master from upstream (apache/superset)..."
          if ! response=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/merge-upstream" \
            -f branch=master 2>&1); then
            echo "::error::Fork sync failed (master may have diverged or the token lacks write access)."
            echo "$response"
            exit 1
          fi
          echo "$response"
          echo "Sync complete."

      - name: Notify on failure
        # Runs only when the sync step fails (e.g. UPSTREAM_SYNC_TOKEN expired
        # or revoked). Files/updates a tracked issue (deduped by label, via the
        # default GITHUB_TOKEN), writes a job summary, and posts to Slack when
        # the optional SLACK_WEBHOOK_URL is set. The run is already red either
        # way, which also triggers GitHub's scheduled-failure email.
        if: failure()
        env:
          GH_ISSUE_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ISSUE_LABEL: upstream-sync-token
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          msg="Upstream fork sync FAILED for ${REPO}. Check UPSTREAM_SYNC_TOKEN (expired/revoked?) or branch divergence. Run: ${RUN_URL}"
          echo "::error::${msg}"
          {
            echo "## :rotating_light: Upstream sync failed"
            echo ""
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"

          # File or update a single tracked issue (deduped by label). Uses the
          # default GITHUB_TOKEN; degrades to a warning if Issues are disabled.
          GH_TOKEN="$GH_ISSUE_TOKEN" gh label create "$ISSUE_LABEL" \
            --repo "$REPO" --color FBCA04 \
            --description "Health alerts for the UPSTREAM_SYNC_TOKEN PAT" \
            >/dev/null 2>&1 || true
          existing=$(GH_TOKEN="$GH_ISSUE_TOKEN" gh issue list \
            --repo "$REPO" --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            GH_TOKEN="$GH_ISSUE_TOKEN" gh issue comment "$existing" \
              --repo "$REPO" --body "$msg" \
              && echo "Updated tracking issue #$existing." \
              || echo "::warning::Could not comment on issue #$existing (are Issues enabled?)."
          else
            GH_TOKEN="$GH_ISSUE_TOKEN" gh issue create \
              --repo "$REPO" --title ":rotating_light: Upstream fork sync failed" \
              --label "$ISSUE_LABEL" --body "$msg" \
              && echo "Filed a new tracking issue." \
              || echo "::warning::Could not create an issue (are Issues enabled on $REPO?)."
          fi

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            payload=$(jq -n --arg t ":rotating_light: ${msg}" '{text: $t}')
            curl -fsS -X POST -H 'Content-type: application/json' \
              --data "$payload" "$SLACK_WEBHOOK_URL" \
              || echo "::warning::Slack notification failed to send."
          fi
